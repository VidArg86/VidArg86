<svg width="500" height="220" viewBox="0 0 500 220" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="rgb-wave" x1="0%" y1="0%" x2="100%" y2="0%" spreadMethod="repeat">
      <stop offset="0%" stop-color="#00FFFF" />
      <stop offset="33%" stop-color="#FFF700" />
      <stop offset="66%" stop-color="#BD00FF" />
      <stop offset="100%" stop-color="#00FFFF" />
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1 0" dur="4s" repeatCount="indefinite" />
    </linearGradient>

    <pattern id="waves-pattern" width="500" height="220" patternUnits="userSpaceOnUse">
      <rect width="100%" height="100%" fill="#1a1b26"/> 
      <path d="M0,0 C150,50 350,50 500,0 L500,220 C350,170 150,170 0,220 Z" fill="#2c2c3c" fill-opacity="0.3"/> 
      <path d="M0,50 C150,100 350,100 500,50 L500,220 C350,120 150,120 0,170 Z" fill="#3a3a4c" fill-opacity="0.2"/> 
      <rect width="100%" height="100%" fill="url(#rgb-wave)" fill-opacity="0.03" />
    </pattern>

     <linearGradient id="vaporwave-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00FFFF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFF700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#BD00FF;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="500" height="220" rx="8" fill="url(#waves-pattern)" stroke="#D4AF37" stroke-width="2"/>
  
  <text x="25" y="35" font-family="Segoe UI, sans-serif" font-weight="600" font-size="18" fill="url(#vaporwave-gradient)">About Me</text>
  

  <g font-family="Segoe UI, sans-serif" font-size="14" fill="#FFFFFF">
    <text x="10" y="75">* Total Height:</text> 
    <text x="100" y="75" font-weight="700" fill="#A9B1D6">Two Dwarves on a trench coat</text>
    
    <text x="10" y="105">* F1 GPs raced:</text> 
    <text x="105" y="105" font-weight="700" fill="#A9B1D6">0</text>
    
    <text x="10" y="135">*Amount of repos:</text> 
    <text x="130" y="135" font-weight="700" fill="#A9B1D6">0</text>
  
    <text x="10" y="165">* API keys leaked:</text> 
    <text x="125" y="165" font-weight="700" fill="#A9B1D6">1984</text>
    
    <text x="10" y="195">"Do you even code bro?":</text> 
    <text x="173" y="195" font-weight="700" fill="#A981D6">Check my commit history (No)</text>

  </g>
</svg>
