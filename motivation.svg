<svg width="500" height="220" viewBox="0 0 500 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rgb-wave" x1="0%" y1="0%" x2="400%" y2="0%">
      <stop offset="0%" stop-color="#00FFFF" />
      <stop offset="12.5%" stop-color="#FFF700" />
      <stop offset="25%" stop-color="#BD00FF" />
      <stop offset="37.5%" stop-color="#00FFFF" />
      
      <stop offset="50%" stop-color="#00FFFF" />
      <stop offset="62.5%" stop-color="#FFF700" />
      <stop offset="75%" stop-color="#BD00FF" />
      <stop offset="87.5%" stop-color="#00FFFF" />
      
      <stop offset="100%" stop-color="#00FFFF" />
      
      <animateTransform 
        attributeName="gradientTransform" 
        type="translate" 
        from="0 0" 
        to="-2 0" 
        dur="8s" 
        repeatCount="indefinite" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="500" height="220" fill="#1A1B27"/>
  
  <text x="25" y="35" font-family="Segoe UI, sans-serif" font-weight="600" font-size="18" fill="url(#rgb-wave)">VidArg86's Motivation Card</text>
  
  <g transform="translate(420, 110)">
    <text text-anchor="middle" x="0" y="-10" font-family="Arial, sans-serif" font-weight="700" font-size="52" fill="#7F00FF">F</text>
    <rect x="-40" y="30" width="80" height="10" fill="#2c2c2c" rx="5" />
    <rect x="-40" y="30" width="8" height="10" fill="#7F00FF" rx="5" />
  </g>

  <g font-family="Segoe UI, sans-serif" font-size="14" fill="#FFFFFF">
    <text x="50" y="75">Total Stars Earned:</text> 
    <text x="280" y="75" font-weight="700" fill="#A9B1D6">0</text>
    
    <text x="50" y="105">Quantum Computers Built:</text> 
    <text x="280" y="105" font-weight="700" fill="#A9B1D6">0</text>
    
    <text x="50" y="135">Ski-net Security Risks:</text> 
    <text x="280" y="135" font-weight="700" fill="#A9B1D6">1</text>
    
    <text x="50" y="165">Current Desire to Code:</text> 
    <text x="280" y="165" font-weight="700" fill="#A9B1D6">3%</text>
    
    <text x="50" y="195">Desire to Build Quantum Computer:</text> 
    <text x="280" y="195" font-weight="700" fill="#A9B1D6">0%</text>
  </g>
</svg>

