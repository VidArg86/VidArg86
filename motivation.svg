<svg width="500" height="220" viewBox="0 0 500 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rgb-wave" x1="0%" y1="0%" x2="400%" y2="0%">
      <stop offset="0%" stop-color="#00FFFF" />
      <stop offset="12.5%" stop-color="#FFF700" />
      <stop offset="25%" stop-color="#BD00FF" />
      <stop offset="37.5%" stop-color="#00FFFF" />
      
      <stop offset="50%" stop-color="#00FFFF" />
      <stop offset="62.5%" stop-color="#FFF700" />
      <stop offset="75%" stop-color="#BD00FF" />
      <stop offset="87.5%" stop-color="#00FFFF" />
      
      <stop offset="100%" stop-color="#00FFFF" />
      
      <animateTransform 
        attributeName="gradientTransform" 
        type="translate" 
        from="0 0" 
        to="-2 0" 
        dur="8s" 
        repeatCount="indefinite" />
    </linearGradient>
