<svg width="500" height="220" viewBox="0 0 500 220" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="rgb-wave" x1="0%" y1="0%" x2="100%" y2="0%" spreadMethod="repeat">
      <stop offset="0%" stop-color="#00FFFF" />
      <stop offset="33%" stop-color="#FFF700" />
      <stop offset="66%" stop-color="#BD00FF" />
      <stop offset="100%" stop-color="#00FFFF" />
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1 0" dur="4s" repeatCount="indefinite" />
    </linearGradient>

    <pattern id="waves-pattern" width="500" height="220" patternUnits="userSpaceOnUse">
      <rect width="100%" height="100%" fill="#1a1b26"/> 
      <path d="M0,0 C150,50 350,50 500,0 L500,220 C350,170 150,170 0,220 Z" fill="#2c2c3c" fill-opacity="0.3"/> 
      <path d="M0,50 C150,100 350,100 500,50 L500,220 C350,120 150,120 0,170 Z" fill="#3a3a4c" fill-opacity="0.2"/> 
      <rect width="100%" height="100%" fill="url(#rgb-wave)" fill-opacity="0.03" />
    </pattern>
  </defs>

  <rect x="0" y="0" width="500" height="220" rx="8" fill="url(#waves-pattern)" stroke="#D4AF37" stroke-width="2"/>
  
  <text x="25" y="35" font-family="Segoe UI, sans-serif" font-weight="600" font-size="18" fill="url(#rgb-wave)">VidArg86's Motivation Card</text>
  
  <g font-family="Segoe UI, sans-serif" font-size="13" fill="#FFFFFF">
    <text x="30" y="70">Total Stars Earned:</text> 
    <text x="260" y="70" font-weight="700" fill="#A9B1D6">0</text>
    
    <text x="30" y="95">Quantum Computers Built:</text> 
    <text x="260" y="95" font-weight="700" fill="#A9B1D6">0</text>
    
    <text x="30" y="120">Ski-net Security Risks:</text> 
    <text x="260" y="120" font-weight="700" fill="#A9B1D6">1</text>
    
    <text x="30" y="145">Current Desire to Code:</text> 
    <text x="260" y="145" font-weight="700" fill="#A9B1D6">3%</text>
    
    <text x="30" y="170">Desire to Build Quantum Computer:</text> 
    <text x="260" y="170" font-weight="700" fill="#A9B1D6">0%</text>
  </g>

  <g transform="translate(425, 120)">
    <text text-anchor="middle" x="0" y="0" font-family="Arial, sans-serif" font-weight="700" font-size="52" fill="#7F00FF">F</text>
    <rect x="-40" y="30" width="80" height="10" fill="#2c2c2c" rx="5" />
    <rect x="-40" y="30" width="8" height="10" fill="#7F00FF" rx="5" />
  </g>
</svg>


